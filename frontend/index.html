<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Chat</title>
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #f4f4f4; 
            margin: 0;
        }
        .chat-container { 
            width: 75%; 
            height: 85vh; 
            background: white; 
            border-radius: 15px; 
            padding: 20px; 
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); 
            display: flex; 
            flex-direction: column; 
        }
        .chat-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #1d3557;
            margin-bottom: 20px;
        }
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            border-bottom: 1px solid #ccc; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { 
            padding: 14px; 
            border-radius: 15px; 
            max-width: 75%; 
            font-size: 16px; 
        }
        .user { 
            align-self: flex-end; 
            background: #a8dadc; 
            color: #1d3557; 
        }
        .bot { 
            align-self: flex-start; 
            background: #f1faee; 
            color: #457b9d; 
        }
        .input-container { 
            display: flex; 
            margin-top: 15px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 12px; 
            font-size: 16px; 
        }
        button { 
            padding: 12px 20px; 
            margin-left: 8px; 
            background: #457b9d; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
        }
        /* Spinner Styling */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #457b9d;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
            display: block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-message {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            color: #457b9d;
        }
    </style>
</head>

<body>
    <div id="app" class="chat-container">
        <!-- Title -->
        <div class="chat-title">Quran-AI</div>

        <!-- Chat Box -->
        <div class="chat-box" ref="chatBox">
            <div v-for="message in messages" :class="['message', message.sender]" v-html="message.html"></div>
            <!-- Loading Indicator -->
            <div v-if="isLoading" class="loading-message">
                <div class="spinner"></div>
                <span>Waiting for response...</span>
            </div>
        </div>

        <!-- Input Container -->
        <div class="input-container">
            <input v-model="input" @keyup.enter="sendMessage" placeholder="Type a message...">
            <button @click="sendMessage">Send</button>
        </div>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    input: "",
                    messages: [],
                    token: null,
                    isLoading: false // Tracks whether the app is waiting for a response
                };
            },
            async created() {
                await this.fetchToken();
            },
            methods: {
                async fetchToken() {
                    try {
                        const response = await fetch("http://localhost:5000/token");
                        const data = await response.json();
                        this.token = data.token;
                        localStorage.setItem("jwt_token", this.token);
                    } catch (error) {
                        console.error("Error fetching token:", error);
                    }
                },
                async sendMessage() {
                    if (!this.input.trim()) return;

                    const userInput = this.input;
                    this.messages.push({ sender: "user", html: `<div>${marked.parse(userInput)}</div>` });
                    this.input = "";
                    this.isLoading = true; // Show spinner

                    const storedToken = localStorage.getItem("jwt_token");
                    if (!storedToken) {
                        console.error("No JWT Token found.");
                        this.isLoading = false; // Hide spinner
                        return;
                    }

                    try {
                        const response = await fetch("http://localhost:5000/chat", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${storedToken}`
                            },
                            body: JSON.stringify({ message: userInput })
                        });

                        if (response.status === 401 || response.status === 403) {
                            console.error("Unauthorized or invalid token. Fetching new token...");
                            await this.fetchToken();
                            this.isLoading = false; // Hide spinner
                            return;
                        }

                        const data = await response.json();
                        this.messages.push({ sender: "bot", html: marked.parse(data.text) });
                    } catch (error) {
                        console.error("Error sending message:", error);
                        this.messages.push({ sender: "bot", html: "<div>An unexpected error occurred.</div>" });
                    } finally {
                        this.isLoading = false; // Hide spinner after response
                        this.scrollToBottom();
                    }
                },
                scrollToBottom() {
                    this.$nextTick(() => {
                        this.$refs.chatBox.scrollTop = this.$refs.chatBox.scrollHeight;
                    });
                }
            }
        }).mount("#app");
    </script>
</body>
</html>
