<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Chat</title>
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .chat-container { width: 75%; height: 85vh; background: white; border-radius: 15px; padding: 20px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; padding: 15px; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 14px; border-radius: 15px; max-width: 75%; font-size: 16px; }
        .user { align-self: flex-end; background: #a8dadc; color: #1d3557; }
        .bot { align-self: flex-start; background: #f1faee; color: #457b9d; }
        .input-container { display: flex; margin-top: 15px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; }
        button { padding: 12px 20px; margin-left: 8px; background: #457b9d; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div id="app" class="chat-container">
        <div class="chat-box" ref="chatBox">
            <div v-for="message in messages" :class="['message', message.sender]" v-html="message.html"></div>
        </div>
        <div class="input-container">
            <input v-model="input" @keyup.enter="sendMessage" placeholder="Type a message...">
            <button @click="sendMessage">Send</button>
        </div>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    input: "",
                    messages: []
                };
            },
            methods: {
                async sendMessage() {
                    if (!this.input) return;
                    
                    const userInput = this.input;
                    this.messages.push({ sender: "user", html: `<div>${marked.parse(userInput)}</div>` });
                    this.input = "";

                    const response = await fetch("http://localhost:5000/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: userInput })
                    });

                    const reader = response.body.getReader();
                    let botMessage = { sender: "bot", text: "", html: "" };
                    this.messages.push(botMessage);

                    async function readStream() {
                        const { done, value } = await reader.read();
                        if (done) {
                            botMessage.html = marked.parse(botMessage.text);
                            return;
                        }
                        
                        const text = new TextDecoder().decode(value);
                        console.log("Raw Response:", text);

                        try {
                            text.split("\n").forEach(line => {
                                if (line) {
                                    const data = JSON.parse(line);
                                    if (data.text) {
                                        botMessage.text += data.text;
                                        botMessage.html = marked.parse(botMessage.text);
                                        app.messages = [...app.messages];
                                        app.$nextTick(() => {
                                            app.$refs.chatBox.scrollTop = app.$refs.chatBox.scrollHeight;
                                        });
                                    }
                                }
                            });
                        } catch (err) {
                            console.error("Error parsing JSON:", text, err);
                        }
                        readStream();
                    }
                    readStream();
                }
            }
        }).mount("#app");
    </script>
</body>
</html>
